# Builds and publishes a GitHub release, started either way:
#   * push a version tag:   git tag -a v0.1.0 -m "Sanguine City 0.1.0" && git push origin v0.1.0
#   * or Actions > Release > Run workflow, entering the tag: it is created on the chosen branch's latest commit.
# Release notes come from Docs/releases/<tag>.md (falling back to GitHub's generated notes).
# v0.x and tags with a suffix (v1.0.0-rc1) are published as pre-releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # The pushed tag, or the tag typed in when the workflow is run by hand.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a version tag like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Integration tests
        run: dotnet run --project Server/Tests/SanguineTests.csproj -c Release

      - name: Publish the dedicated server
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          mkdir -p dist
          for rid in linux-x64 win-x64; do
            dotnet publish Server/SanguineServer.csproj -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:InvariantGlobalization=true \
              -p:DebugType=none -o "out/$rid"
            cp README.md CREDITS.md "out/$rid/"
          done
          ./out/linux-x64/SanguineServer --help
          tar -C out/linux-x64 -czf "dist/SanguineServer-${tag}-linux-x64.tar.gz" .
          (cd out/win-x64 && zip -qr "../../dist/SanguineServer-${tag}-win-x64.zip" .)
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Already published (for example from the Releases page): just attach the builds.
            gh release upload "$tag" dist/* --clobber
            exit 0
          fi
          notes="Docs/releases/${tag}.md"
          args=(--title "Sanguine City ${tag}")
          # A pushed tag must already exist; a hand-started run creates it on the commit it built.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          case "$tag" in v0.*|*-*) args+=(--prerelease) ;; esac
          gh release create "$tag" dist/* "${args[@]}"
